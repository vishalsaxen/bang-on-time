name: Send scheduled WhatsApp messages

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub may start runs a few minutes late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print what would be sent'
        type: boolean
        default: false

permissions:
  contents: write   # to commit sent-log.json so nothing is sent twice

concurrency:
  group: send-scheduled
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send messages that are due
        env:
          TZ: ${{ vars.TIMEZONE || 'Asia/Kolkata' }}
          COUNTRY_CODE: ${{ vars.COUNTRY_CODE || '91' }}
          LATE_LIMIT_MINUTES: ${{ vars.LATE_LIMIT_MINUTES || '30' }}
          DRY_RUN: ${{ inputs.dry_run || vars.DRY_RUN || '' }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TEMPLATE: ${{ vars.WHATSAPP_TEMPLATE }}
          WHATSAPP_TEMPLATE_LANG: ${{ vars.WHATSAPP_TEMPLATE_LANG || 'en' }}
          WHATSAPP_TEMPLATE_FIELDS: ${{ vars.WHATSAPP_TEMPLATE_FIELDS || 'name,message' }}
          SCHEDULE_CSV: ${{ secrets.SCHEDULE_CSV }}
        run: node cloud-sender/send.js

      - name: Save the sent log
        if: always()
        run: |
          git diff --quiet -- cloud-sender/sent-log.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add cloud-sender/sent-log.json
          git commit -m "Update sent log [skip ci]"
          git pull --rebase
          git push
